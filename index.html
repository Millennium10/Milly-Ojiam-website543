<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Business Page</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0a0a0a;
            color: #fff;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 40px 20px;
            text-align: center;
        }

        img {
            width: 250px;
            height: 300px;
            border-radius: 10%;
            border: 4px solid #120d0d;
            object-fit: cover;
        }

        h1 {
            margin-top: 15px;
            font-size: 28px;
        }

        .intro {
            margin-top: 20px;
            font-size: 16px;
            line-height: 1.6;
            color: #ccc;
        }

        .buttons {
            margin-top: 30px;
        }

        .btn {
            display: inline-block;
            margin: 10px;
            padding: 12px 20px;
            text-decoration: none;
            color: #fff;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        .whatsapp {
            background-color: #25D366;
        }

        .tiktok {
            background-color: #ff0050;
        }

        .btn:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }

        footer {
            margin-top: 40px;
            font-size: 14px;
            color: #777;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- Profile Image -->
        <img src="Milly88.jpeg" alt="My Photo">

        <img src="Millyglass64.jpeg" alt="My Photo">

        <img src="millyche.jpeg" alt="My Photo">
        
        <!-- Name -->
        <h1>Feelings Web Development</h1>

        <!-- Business Introduction -->
        <p class="intro">
            Hi, I’m a professional web developer and video editor.  
            I create modern websites, edit high-quality videos, and help businesses grow online.  
            Let’s work together to bring your ideas to life.
        </p>

        <!-- Buttons -->
        <div class="buttons">
            <a href="https://wa.me/2349022923824" target="_blank" class="btn whatsapp">
                Chat me on WhatsApp
            </a>

            <a href="https://www.tiktok.com/@_millyojima" target="_blank" class="btn tiktok">
                Follow me on TikTo
            </a>
        </div>

        <!-- Footer -->
        <footer>
            © 2026 Milly Ojima. All rights reserved.
        </footer>

    </div>

</body>
</html>
